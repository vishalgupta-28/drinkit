<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1A1A2E; /* Exact Brand Anchor Match */
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .loading-track {
            height: 4px;
            width: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background: #0C831F; /* Exact Brand Anchor Match */
            width: 0%;
            border-radius: 99px;
            animation: loadingProgress 3.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes loadingProgress {
            0% { width: 0%; }
            20% { width: 10%; }
            40% { width: 60%; }
            70% { width: 85%; }
            100% { width: 100%; }
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-glow {
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex flex-col items-center justify-between min-h-screen">
<!-- Background Atmospheric Element (Optional WebGL/Shader could go here) -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary blur-[120px]"></div>
</div>
<!-- Main Content Container (Centered) -->
<main class="flex-grow flex flex-col items-center justify-center z-10 px-margin-mobile">
<div class="fade-in flex flex-col items-center text-center space-y-6">
<!-- Icon -->
<div class="glass-glow mb-2">
<span class="material-symbols-outlined text-[80px] text-white select-none" style="font-variation-settings: 'FILL' 1, 'wght' 300;">
                    wine_bar
                </span>
</div>
<!-- Brand Wordmark -->
<div class="flex flex-col items-center gap-1">
<h1 class="font-h1 text-h1 text-white tracking-tighter" style="font-size: 32px;">
                    DrinkIt
                </h1>
<p class="font-body text-body text-white/60 tracking-wide mt-1">
                    Alcohol delivered in 30 min
                </p>
</div>
</div>
</main>
<!-- Bottom Interactive/Loading Area -->
<footer class="w-full flex flex-col items-center gap-8 pb-12 z-10">
<!-- Loading Animation Area -->
<div class="flex flex-col items-center space-y-4">
<div class="loading-track">
<div class="loading-bar"></div>
</div>
<span class="font-caption text-caption text-white/30 tracking-[0.2em] uppercase">
                Loading...
            </span>
</div>
<!-- Responsibility Message -->
<div class="flex items-center gap-2 text-white/40">
<span class="font-caption text-caption">Drink Responsibly 🙏</span>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated redirection logic after loading bar finishes
            const loadingBar = document.querySelector('.loading-bar');
            loadingBar.addEventListener('animationend', () => {
                // In a real app, this would trigger navigation to the main Shop screen
                console.log('Splash sequence complete. Transitioning to Home...');
            });

            // Gentle parallax movement based on device orientation (if mobile) or mouse (if desktop)
            window.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5) * 15;
                const y = (e.clientY / window.innerHeight - 0.5) * 15;
                const glass = document.querySelector('.glass-glow');
                if(glass) {
                    glass.style.transform = `translate(${x}px, ${y}px)`;
                }
            });
        });
    </script>
</body></html>
