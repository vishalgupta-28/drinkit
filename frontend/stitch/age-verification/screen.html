<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom animation for the card entry */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .overlay-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
        }
    </style>

<body class="bg-background text-on-surface antialiased overflow-hidden">
<!-- Full Screen Background Container -->
<div class="relative min-h-screen w-full flex items-end md:items-center justify-center p-4 md:p-8">
<!-- Background Image with Dark Overlay -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="w-full h-full scale-105" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBAueBJLFycg0mZFAiPcpOrO8lD44U44AZ_10YPdmHQarwcM3tXuTmnfvd9xIfLneeB27yelo3vRqW6K0NUxZ5nyKH-GWAGmrr3eSjy4FL4d2k_ZK7cSzcXAUqOXJ2mjgcC4ga1HkbBq7dH1rMKfPC1GUc6-e_jYjVjENMTFY1WJD1DeSz8ePWGMSM_xAHELGa4CAaywIsJaNhMw22Yk0-nTUaB9urLNknvN_g1RQ_4acN9FaN3t-wu1Tj9ZMFdsUDHvjQffy9TFFQ'); background-size: cover; background-position: center;">
</div>
<div class="absolute inset-0 overlay-gradient z-10 backdrop-blur-[2px]"></div>
</div>
<!-- Verification Card -->
<main class="relative z-20 w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-2xl p-xl md:p-xl animate-slide-up transform transition-all hover:shadow-[0_20px_50px_rgba(0,0,0,0.2)]">
<div class="flex flex-col items-center text-center space-y-lg">
<!-- Icon Branding -->
<div class="flex items-center justify-center w-20 h-20 bg-surface-container rounded-full mb-2">
<span aria-label="18 plus restricted" class="text-5xl" role="img">🔞</span>
</div>
<!-- Text Content -->
<div class="space-y-sm">
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">
                        Are you 21 or older?
                    </h1>
<p class="font-body text-body text-muted px-4">
                        DrinkIt delivers alcohol. You must be of legal drinking age to continue.
                    </p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md pt-4">
<!-- Primary Yes Button -->
<button class="group relative w-full h-[56px] bg-primary-container text-on-primary-container font-h3 text-h3 rounded-xl overflow-hidden transition-all duration-300 active:scale-95 hover:brightness-110 shadow-md">
<span class="relative z-10">Yes, I'm 21+</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- Secondary No Button -->
<button class="w-full h-[56px] bg-transparent border-2 border-outline-variant text-on-surface-variant font-h3 text-h3 rounded-xl transition-all duration-200 active:scale-95 hover:bg-surface-container-low">
                        No, I'm not
                    </button>
</div>
<!-- Legal Footer -->
<footer class="pt-4 px-2">
<p class="font-caption text-caption text-muted leading-relaxed">
                        By continuing, you agree to our 
                        <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> 
                        and confirm you are of legal age.
                    </p>
</footer>
</div>
</main>
<!-- Brand Mark (Atmospheric) -->
<div class="absolute top-10 left-1/2 -translate-x-1/2 z-20 md:left-margin-desktop md:translate-x-0">
<div class="flex items-center gap-2 text-white">
<span class="material-symbols-outlined text-4xl">wine_bar</span>
<span class="font-h1 text-h1 tracking-tighter">DrinkIt</span>
</div>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const primaryBtn = document.querySelector('button.bg-primary-container');
            const secondaryBtn = document.querySelector('button.bg-transparent');

            primaryBtn.addEventListener('click', () => {
                // Mock transition for confirmation
                primaryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
                setTimeout(() => {
                    window.location.reload(); // Simulate entry
                }, 800);
            });

            secondaryBtn.addEventListener('click', () => {
                alert("You must be 21 or older to access DrinkIt.");
            });
        });
    </script>
</body></html>
