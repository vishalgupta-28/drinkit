<!DOCTYPE html>

<html class="light" lang="en"><head>

        .material-symbols-outlined {

        }
        .otp-input.filled {
            border-color: #0c831f;
            color: #171d15;
            font-weight: 700;
        }
        /* Remove arrows from number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>

                        "on-tertiary-container": "#f9f5ff",

                        "surface-container-lowest": "#ffffff",

                        "primary-container": "#0c831f",

                        "on-secondary-fixed-variant": "#594400",
                        "on-tertiary-fixed-variant": "#45455b",
                        "on-tertiary-fixed": "#1a1a2e",
                        "surface-dim": "#d6dccf",
                        "gold-light": "#FFF8E1",
                        "tertiary-container": "#706f87",
                        "secondary-container": "#fec70f",

                        "tertiary-fixed-dim": "#c6c4df",
                        "on-secondary-container": "#6e5400",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",

                        "danger": "#D32F2F",

                        "error-container": "#ffdad6",

                    },
                    "borderRadius": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background font-body text-on-background min-h-screen flex flex-col items-center">
<!-- Top Navigation Header -->
<header class="w-full max-w-md bg-background px-margin-mobile h-14 flex items-center justify-between sticky top-0 z-50">
<button aria-label="Back" class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-tertiary-fixed font-bold">arrow_back</span>
</button>
<div class="flex-1"></div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-mobile flex-1 flex flex-col pt-8">
<!-- Header Section -->
<section class="mb-xl animate-in fade-in slide-in-from-bottom-4 duration-700">
<h1 class="font-h1 text-h1 text-on-tertiary-fixed mb-2">Enter verification code</h1>
<p class="font-body text-muted">
                Sent to +91 98765 43210 
                <a class="text-primary-container font-semibold ml-1 hover:underline" href="#">Edit</a>
</p>
</section>
<!-- OTP Input Section -->
<section class="mb-lg">
<div class="flex justify-between gap-2 max-w-sm" id="otp-container">
<!-- 6 boxes of 52x64px -->
<input autofocus="" class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="0" maxlength="1" type="number"/>
<input class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="1" maxlength="1" type="number"/>
<input class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="2" maxlength="1" type="number"/>
<input class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="3" maxlength="1" type="number"/>
<input class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="4" maxlength="1" type="number"/>
<input class="otp-input w-[52px] h-[64px] text-center text-xl font-h1 border-2 border-on-tertiary-fixed rounded-xl bg-transparent transition-all" data-index="5" maxlength="1" type="number"/>
</div>
</section>
<!-- Timer/Resend Section -->
<section class="mb-xl">
<p class="text-muted font-body">
                Resend OTP in <span class="font-semibold" id="timer">0:27</span>
</p>
</section>
<!-- Dynamic Success Feedback (Hidden initially) -->
<div class="hidden flex items-center gap-3 p-4 bg-primary-light rounded-xl border border-primary-container/20 text-primary-container animate-pulse" id="success-feedback">
<span class="material-symbols-outlined fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-semibold">Verifying your identity...</span>
</div>
</main>
<!-- Footer Disclaimer -->
<footer class="w-full max-w-md px-margin-mobile py-8 text-center mt-auto">
<p class="text-caption text-muted opacity-80">
            By continuing you accept our 
            <a class="underline hover:text-primary transition-colors" href="#">Terms of Service</a>
</p>
</footer>
<!-- Interactive Logic -->
<script>
        const inputs = document.querySelectorAll('.otp-input');
        const container = document.getElementById('otp-container');
        const successFeedback = document.getElementById('success-feedback');
        const timerElement = document.getElementById('timer');

        // Handle OTP Logic
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length > 0) {
                    input.classList.add('filled');
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    input.classList.remove('filled');
                }

                // Auto-verify check
                const otp = Array.from(inputs).map(i => i.value).join('');
                if (otp.length === 6) {
                    verifyOTP(otp);
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].classList.remove('filled');
                }
            });

            // Prevent multiple chars
            input.addEventListener('beforeinput', (e) => {
                if (input.value.length >= 1 && e.data !== null) {
                    e.preventDefault();
                }
            });
        });

        function verifyOTP(code) {
            // Trigger auto-verify styling
            successFeedback.classList.remove('hidden');
            inputs.forEach(input => {
                input.disabled = true;
                input.classList.add('opacity-50');
            });
            
            // Mock Redirect / Verification Success
            setTimeout(() => {
                console.log('OTP Verified:', code);
                // In a real app: window.location.href = '/home';
            }, 1500);
        }

        // Mock Timer Logic
        let timeLeft = 27;
        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.parentElement.innerHTML = '<a href="#" class="text-primary-container font-semibold hover:underline">Resend OTP now</a>';
            } else {
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerElement.textContent = `0:${seconds}`;
            }
        }, 1000);

        // Simple haptic feedback simulation on focus
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
